name: Clean up artifacts

# Deletes this repository's Actions artifacts to free the account's Actions
# storage (artifacts of private repositories count against it; release
# assets do not). It runs only by hand, from the Actions tab or the GitHub
# mobile app, and only after typing DELETE. Deleted artifacts cannot be
# restored. Code, branches, tags, releases and run logs are not touched.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE to remove every artifact of this repository. This cannot be undone."
        required: true
        default: ""

permissions:
  actions: write

concurrency:
  group: cleanup-artifacts
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete every artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          # Phone keyboards capitalise only the first letter and add a
          # trailing space, so case and spaces are ignored.
          confirm=$(printf '%s' "$CONFIRM" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          if [ "$confirm" != "DELETE" ]; then
            echo "::error::Nothing deleted. The confirm box held '$CONFIRM'. Type DELETE to run the cleanup."
            exit 1
          fi

          # List first, then delete: deleting while paging would skip items.
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | "\(.id) \(.size_in_bytes) \(.name)"' > artifacts.txt

          count=0
          bytes=0
          while read -r id size name; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            count=$((count + 1))
            bytes=$((bytes + size))
            echo "Deleted $name ($((size / 1048576)) MiB)"
          done < artifacts.txt

          echo "Deleted $count artifacts, $((bytes / 1048576)) MiB freed." | tee -a "$GITHUB_STEP_SUMMARY"
