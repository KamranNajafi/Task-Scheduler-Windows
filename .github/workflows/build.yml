name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub Release with this tag (e.g. v1.0.0). Leave empty for a plain build."
        required: false
        default: ""

permissions:
  contents: write   # lets the in-Actions GITHUB_TOKEN create the tag + release

jobs:
  build:
    runs-on: windows-latest

    env:
      PROJECT: src/TaskDelegator/TaskDelegator.csproj
      CONFIG: Release
      RID: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore $env:PROJECT

      - name: Publish portable single-file exe
        run: >
          dotnet publish $env:PROJECT
          -c $env:CONFIG
          -r $env:RID
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Show output
        run: Get-ChildItem publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskDelegator-${{ env.RID }}
          path: publish/TaskDelegator.exe
          if-no-files-found: error

      # Resolve a release tag from any of: a pushed tag, a manual dispatch input,
      # or a branch push whose head commit says [release] (tag read from VERSION).
      - name: Determine release tag
        id: rel
        shell: bash
        env:
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.release_tag }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          tag=""
          if [[ "${REF}" == refs/tags/v* ]]; then
            tag="${REF#refs/tags/}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
          elif [[ "${COMMIT_MSG}" == *"[release]"* && -f VERSION ]]; then
            tag="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: '${tag}'"

      - name: Publish GitHub Release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Task Delegator ${{ steps.rel.outputs.tag }}
          files: publish/TaskDelegator.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Portable, self-contained Windows executable — no installation, no .NET
            runtime required on the target machine.

            **TaskDelegator.exe** — Privileged Application Delegation for Windows.
            An administrator lets a standard (non-admin) user run specific approved
            applications with administrator rights, without the admin password, and
            with a run-only "Allowed Programs" launcher for classroom / lab use.
            See the README for usage and the security model.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
