name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub Release with this tag (e.g. v1.0.0). Leave empty for a plain build."
        required: false
        default: ""

permissions:
  contents: write   # lets the in-Actions GITHUB_TOKEN create the tag + release

jobs:
  build:
    runs-on: windows-latest

    env:
      PROJECT: src/TaskDelegator/TaskDelegator.csproj
      CONFIG: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore $env:PROJECT

      - name: Publish Windows 10/11 build (net8, portable single-file)
        run: >
          dotnet publish $env:PROJECT
          -c $env:CONFIG
          -f net8.0-windows
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          -p:EnableCompressionInSingleFile=true
          -o publish/net8

      - name: Publish Windows 7 build (net48, needs .NET Framework 4.8)
        run: dotnet publish $env:PROJECT -c $env:CONFIG -f net48 -o publish/net48

      - name: Zip Windows 7 (net48) output
        shell: pwsh
        run: Compress-Archive -Path publish/net48/* -DestinationPath publish/TaskDelegator-win7-net48.zip -Force

      - name: Download Visual C++ redistributable (x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path redist | Out-Null
          Invoke-WebRequest -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile redist/vc_redist.x64.exe

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer (Windows 10/11, bundles VC++ runtime)
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim().TrimStart('v')
          if (-not $ver) { $ver = "1.0.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer/TaskDelegator.iss
          Get-ChildItem installer_out

      - name: Show output
        shell: pwsh
        run: |
          Get-ChildItem publish/net8
          Get-ChildItem publish/*.zip
          Get-ChildItem installer_out

      - name: Upload Windows 10/11 artifact (portable exe)
        uses: actions/upload-artifact@v4
        with:
          name: TaskDelegator-win-x64
          path: publish/net8/TaskDelegator.exe
          if-no-files-found: error

      - name: Upload Windows 7 artifact (net48 zip)
        uses: actions/upload-artifact@v4
        with:
          name: TaskDelegator-win7-net48
          path: publish/TaskDelegator-win7-net48.zip
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskDelegatorSetup
          path: installer_out/TaskDelegatorSetup.exe
          if-no-files-found: error

      # Resolve a release tag from any of: a pushed tag, a manual dispatch input,
      # or a branch push whose head commit says [release] (tag read from VERSION).
      - name: Determine release tag
        id: rel
        shell: bash
        env:
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.release_tag }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          tag=""
          if [[ "${REF}" == refs/tags/v* ]]; then
            tag="${REF#refs/tags/}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
          elif [[ "${COMMIT_MSG}" == *"[release]"* && -f VERSION ]]; then
            tag="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: '${tag}'"

      - name: Publish GitHub Release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Task Delegator ${{ steps.rel.outputs.tag }}
          files: |
            installer_out/TaskDelegatorSetup.exe
            publish/net8/TaskDelegator.exe
            publish/TaskDelegator-win7-net48.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Privileged Application Delegation for Windows — an administrator lets a
            standard (non-admin) user run specific approved applications with
            administrator rights, without the admin password, with a run-only
            "Allowed Programs" launcher for classroom / lab use.

            **Downloads**
            - `TaskDelegatorSetup.exe` — **recommended installer** for Windows 10 / 11.
              Installs the app and, if missing, silently installs the Microsoft Visual
              C++ runtime — no prerequisites to set up by hand.
            - `TaskDelegator.exe` — Windows 10 / 11 (x64), portable single file.
              Requires the Visual C++ runtime on the machine (use the installer if you
              hit a "side-by-side configuration is incorrect" error).
            - `TaskDelegator-win7-net48.zip` — Windows 7 SP1 / 8.1 / 10 / 11. Extract
              and run `TaskDelegator.exe`; requires **.NET Framework 4.8** (preinstalled
              on Windows 10/11; installable on Windows 7 SP1). No VC++ runtime needed.

            See the README for usage and the security model.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
